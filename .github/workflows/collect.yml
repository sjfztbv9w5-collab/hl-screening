name: collect-signals

# Stündlicher Scan; Ergebnisse landen im Branch "data" (nicht in main, damit Pages nicht ständig neu baut).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Datenbranch vorbereiten
        run: |
          git config user.name "hl-collector"
          git config user.email "hl-collector@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add data-branch origin/data
            cd data-branch && git checkout -B data
          else
            git worktree add --detach data-branch
            cd data-branch && git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Scan ausführen
        env:
          OUT_DIR: data-branch
        run: |
          # Rohdaten nur alle 6 Stunden (Repo-Größe)
          if [ $(( 10#$(date -u +%H) % 6 )) -eq 0 ]; then export RAW=1; fi
          node collect.js

      - name: Ergebnisse committen
        run: |
          cd data-branch
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push origin data && exit 0
            git pull --rebase origin data
          done
          exit 1
